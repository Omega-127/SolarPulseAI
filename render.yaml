services:
  - type: web
    name: solarpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://solarpulse-ai.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: solarpulse-db
          property: connectionString

databases:
  - name: solarpulse-db
    plan: free
    region: oregon
    databaseName: solar_forecast
    user: postgres
